name: APK oluştur

# Android kabuğu değişince ya da Actions sekmesinden elle çalıştırınca APK derlenir
# ve "Releases" bölümüne indirilebilir olarak konur.
# Sayfa (index.html) değişikliklerinde çalışmaz; onlar uygulamaya kendiliğinden gelir.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # İsteğe bağlı: sabit imza anahtarı (bkz. README). Yoksa geçici anahtarla imzalanır.
      - name: İmza anahtarını hazırla
        env:
          KS_B64: ${{ secrets.KIRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kira.jks"
            echo "KIRA_KEYSTORE_PATH=$RUNNER_TEMP/kira.jks" >> "$GITHUB_ENV"
            echo "Sabit imza anahtarı kullanılıyor."
          else
            echo "Sabit imza anahtarı yok, geçici anahtar kullanılacak."
          fi

      - name: APK derle
        working-directory: android
        env:
          KIRA_KEYSTORE_PASSWORD: ${{ secrets.KIRA_KEYSTORE_PASSWORD }}
          KIRA_KEY_ALIAS: ${{ secrets.KIRA_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk KiraDefteri.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KiraDefteri-apk
          path: KiraDefteri.apk

      - name: Releases'e koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" KiraDefteri.apk \
            --title "Kira Defteri APK ${{ github.run_number }}" \
            --notes "Telefona kurmak için KiraDefteri.apk dosyasını indirin. Uygulamanın içeriği internetten güncellenir; yeni APK yalnızca simge veya ad değişince gerekir."
